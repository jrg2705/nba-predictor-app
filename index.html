<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F97316" />
    <meta name="description" content="NBA Predictor — Análisis con stats reales + Groq AI" />
    <link rel="manifest" href="/manifest.json" />
    <title>NBA Predictor</title>
    <style>
      #initial-splash {
        position: fixed; inset: 0; z-index: 99999;
        background: #0B0F1A;
        display: flex; align-items: center; justify-content: center;
        transition: opacity 0.4s ease;
      }
      #initial-splash.hide {
        opacity: 0;
        pointer-events: none;
        visibility: hidden;
      }
      #initial-splash img {
        width: 100%; height: 100%; object-fit: cover;
      }
    </style>
  </head>
  <body>
    <div id="initial-splash">
      <img src="/splash.png" alt="NBA Predictor" />
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Quitar splash sí o sí a los 2.5s (aunque React falle)
      function hideSplash() {
        var el = document.getElementById("initial-splash");
        if (el) {
          el.classList.add("hide");
          setTimeout(function () { el.remove(); }, 500);
        }
      }
      setTimeout(hideSplash, 2500);

      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("/sw.js").catch(function () {});
        });
      }
    </script>
  </body>
</html>
